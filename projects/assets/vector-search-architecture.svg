<g font-family="Arial, sans-serif" text-anchor="middle" fill="#172c48"><g font-size="19" font-weight="600"><text x="420" y="50">Query embedding + filters</text><text x="420" y="147">Estimate &amp; prune</text><text x="420" y="259">Heuristic router</text><text x="155" y="378">Global search</text><text x="420" y="378">Single partition</text><text x="685" y="378">Parallel partitions</text><text x="420" y="498">Rank / merge → top k matches</text></g><g font-size="15" fill="#526278"><text x="420" y="73">Text · country · year · rating · location</text><text x="420" y="173">EXPLAIN row estimate / table statistics</text><text x="420" y="191">Country + year → eligible partitions</text><text x="420" y="283">Selectivity + partition count</text><text x="155" y="402">Unpartitioned table</text><text x="420" y="402">One eligible leaf</text><text x="685" y="402">Thread pool · local indexes</text></g></g></svg>
